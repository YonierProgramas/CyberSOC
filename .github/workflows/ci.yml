name: CI

on:
  pull_request:
  push:
    branches: [main, Jhonier, s0/ci, s4/fix-ci-quarantine]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  CI: "true"
  # T0.3 still lacks package installation: subprocess tests run from src explicitly.
  PYTHONPATH: ${{ github.workspace }}/CyberSOC/engine/src
  PYTHONDONTWRITEBYTECODE: "1"

jobs:
  app:
    runs-on: windows-latest
    timeout-minutes: 20
    defaults:
      run:
        shell: pwsh
        working-directory: CyberSOC/app
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          path: CyberSOC
          persist-credentials: false
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: lts/*
          cache: npm
          cache-dependency-path: CyberSOC/app/package-lock.json
      # Install the engine so the real-process Vitest test does not skip itself.
      - uses: astral-sh/setup-uv@c18668ad3cf93ea998bef934396af7bb5c839dc7 # v10.2.0
        with:
          version: "0.11.17"
          python-version: "3.12"
          working-directory: CyberSOC/engine
          enable-cache: true
          cache-dependency-glob: uv.lock
          # Sin esto, setup-uv toma cache-dir de pyproject.toml sin resolverlo contra
          # working-directory y el guardado de la caché falla. El input sí se resuelve.
          cache-local-path: .uv-cache
      # --compile-bytecode: con PYTHONDONTWRITEBYTECODE=1 cada arranque del motor
      # recompilaria pydantic desde fuente y engine.hello superaria su timeout de 5 s.
      - name: Install engine for integration tests
        working-directory: CyberSOC/engine
        run: uv sync --locked --compile-bytecode
      - name: Install app
        run: npm ci
      - name: Typecheck
        run: npm run typecheck
      - name: Lint
        run: npm run lint
      - name: Tests (including TypeScript contracts; no live AI smoke)
        run: npm test -- --maxWorkers=2

  engine:
    runs-on: windows-latest
    timeout-minutes: 15
    defaults:
      run:
        shell: pwsh
        working-directory: CyberSOC/engine
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          path: CyberSOC
          persist-credentials: false
      - uses: astral-sh/setup-uv@c18668ad3cf93ea998bef934396af7bb5c839dc7 # v10.2.0
        with:
          version: "0.11.17"
          python-version: "3.12"
          working-directory: CyberSOC/engine
          enable-cache: true
          cache-dependency-glob: uv.lock
          cache-local-path: .uv-cache
      - name: Install engine
        run: uv sync --locked --compile-bytecode
      - name: Lint
        run: uv run --locked ruff check
      - name: Tests (including Python contracts)
        run: uv run --locked pytest

  diagnose-windows:
    if: github.ref == 'refs/heads/s4/fix-ci-quarantine'
    runs-on: windows-latest
    timeout-minutes: 5
    defaults:
      run:
        shell: pwsh
        working-directory: CyberSOC/app
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          path: CyberSOC
          persist-credentials: false
      - name: Diagnose native Windows helper startup (no file operations)
        run: |
          @'
          const { execFile } = require('node:child_process');
          const { readFileSync } = require('node:fs');
          const { join } = require('node:path');
          const source = readFileSync('src/core/quarantine/OriginalFile.ts', 'utf8');
          const script = source.split('const DELETE_SCRIPT = String.raw`')[1].split('`;')[0]
            .replace('  exit [VerifiedDelete]::Run($env:CYBERSOC_DELETE_PATH, $env:CYBERSOC_DELETE_HASH)', '  exit 0');
          const minimal = { SystemRoot: process.env.SystemRoot, TEMP: process.env.TEMP, TMP: process.env.TMP };
          const locations = { ...minimal };
          for (const name of ['USERPROFILE', 'LOCALAPPDATA', 'APPDATA', 'HOMEDRIVE', 'HOMEPATH', 'SystemDrive', 'PATH']) {
            locations[name] = process.env[name];
          }
          async function measure(name, env, command = script) {
            const start = performance.now();
            await new Promise(resolve => execFile(
              join(process.env.SystemRoot, 'System32/WindowsPowerShell/v1.0/powershell.exe'),
              ['-NoProfile', '-NonInteractive', '-EncodedCommand', Buffer.from(command, 'utf16le').toString('base64')],
              { env, windowsHide: true, timeout: 60000 },
              error => { console.log(JSON.stringify({ name, ms: Math.round(performance.now() - start), code: error?.code ?? 0 })); resolve(); }
            ));
          }
          (async () => { await measure('compile-before', minimal, script.replace(/  Import-Module [^\r\n]+\r?\n/, '')); await measure('compile-fixed', minimal); })();
          '@ | node
